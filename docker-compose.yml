version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ott-platform-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: ott-platform
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - ott-network

volumes:
  mongodb_data:
    driver: local

networks:
  ott-network:
    driver: bridge